<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <meta name="screen-orientation" content="landscape">
    <title>Deer Adventure 2D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            /* Use all available height values for max compatibility */
            min-height: 100vh;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-touch-callout: none;
            background: #0f172a;
        }
        
        /* Disable ALL touch delays */
        button, .touch-btn {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
            touch-action: none;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            height: -webkit-fill-available;
            max-width: 100%;
            max-height: 100%;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            touch-action: none;
        }
        
        /* True fullscreen mode */
        .game-container:fullscreen,
        .game-container:-webkit-full-screen,
        .game-container:-moz-full-screen,
        .game-container:-ms-fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            padding: 0 !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
        }
        
        .touch-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            cursor: pointer;
            /* Remove all delays */
            -ms-touch-action: manipulation;
            touch-action: manipulation;
        }
        
        .touch-btn:active, .touch-btn.pressed {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }
        
        .touch-controls {
            touch-action: none;
            -webkit-touch-callout: none;
        }
        
        /* Hide touch controls on desktop */
        @media (hover: hover) and (pointer: fine) {
            .touch-controls {
                display: none !important;
            }
            .canvas-container {
                flex: 1 !important;
                max-height: none !important;
            }
        }
        
        /* Mobile landscape optimization */
        @media (max-height: 500px) and (orientation: landscape) {
            .game-header {
                padding: 2px 8px !important;
                min-height: auto !important;
            }
            .game-header .text-xl, .game-header .text-lg {
                font-size: 12px !important;
            }
            .touch-controls {
                padding: 4px 12px !important;
            }
            .touch-btn {
                width: 44px !important;
                height: 44px !important;
            }
            .jump-btn {
                width: 54px !important;
                height: 54px !important;
            }
        }
        
        /* Small phone optimization */
        @media (max-width: 380px) {
            .game-header {
                padding: 6px 8px !important;
                gap: 4px !important;
            }
            .touch-btn {
                width: 48px !important;
                height: 48px !important;
            }
            .jump-btn {
                width: 56px !important;
                height: 56px !important;
                font-size: 10px !important;
            }
        }
        
        /* Tablet and desktop */
        @media (min-width: 768px) {
            .canvas-container {
                max-width: 900px;
                margin: 0 auto;
            }
        }
        
        /* Fullscreen mode */
        .game-container:fullscreen {
            padding: 0;
        }
        
        .game-container:fullscreen .canvas-container {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body class="bg-slate-900 text-white">
    <div class="game-container">
        <!-- Header HUD -->
        <header class="game-header flex justify-between items-center bg-slate-800/90 px-3 py-2 border-b border-slate-700 shrink-0">
            <div class="flex items-center gap-3">
                <span class="text-lg sm:text-xl font-bold text-yellow-400">🪙 <span id="scoreText">000</span></span>
                <span class="text-xs sm:text-sm text-slate-300">HP: <span id="livesText" class="text-red-400 font-bold">❤❤❤</span></span>
            </div>
            <div class="hidden md:block text-xs text-slate-400">
                [A][D] Jalan | [S] Turun | [W]/[Space] Lompat
            </div>
            <div class="flex gap-2">
                <button id="fullscreenBtn" class="bg-slate-700 hover:bg-slate-600 text-xs px-2 py-1.5 rounded-lg font-bold transition hidden sm:block">
                    ⛶
                </button>
                <button id="resetBtn" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-1.5 rounded-lg font-bold transition">
                    ↻
                </button>
            </div>
        </header>

        <!-- Canvas Container -->
        <main class="canvas-container relative flex-1 flex items-center justify-center p-2 min-h-0">
            <canvas id="gameCanvas" class="w-full h-full max-w-full max-h-full object-contain bg-slate-950 rounded-lg shadow-2xl border-2 border-slate-700"></canvas>

            <!-- UI Overlay (Game Over / Level Complete) -->
            <div id="overlay" class="absolute inset-2 bg-black/85 rounded-lg flex flex-col justify-center items-center text-center p-4 hidden backdrop-blur-sm">
                <h1 id="overlayTitle" class="text-2xl sm:text-4xl md:text-5xl font-extrabold mb-2 text-yellow-400 drop-shadow-md">GAME OVER</h1>
                <p id="overlayMessage" class="text-slate-300 text-xs sm:text-sm md:text-base mb-4">Kamu terjatuh ke dalam jurang!</p>
                <button id="restartOverlayBtn" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-2 px-6 sm:py-3 sm:px-8 rounded-full shadow-lg transform hover:scale-105 transition text-sm sm:text-base">
                    Coba Lagi
                </button>
            </div>
            
            <!-- Main Menu Overlay -->
            <div id="mainMenu" class="absolute inset-0 bg-gradient-to-b from-slate-900 via-slate-800 to-slate-900 rounded-lg flex flex-col justify-center items-center text-center p-4 z-20">
                <!-- Title -->
                <div class="mb-8">
                    <h1 class="text-3xl sm:text-5xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-orange-400 to-yellow-500 drop-shadow-lg mb-2">
                        🦌 DEER ADVENTURE
                    </h1>
                    <p class="text-slate-400 text-sm sm:text-base">A Pixel Platformer Game</p>
                </div>
                
                <!-- Menu Buttons -->
                <div class="flex flex-col gap-4 w-64 sm:w-72">
                    <button id="newGameBtn" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg transform hover:scale-105 transition text-lg">
                        🎮 New Game
                    </button>
                    <button id="continueBtn" class="bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg transform hover:scale-105 transition text-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
                        ▶️ Continue
                    </button>
                </div>
                
                <!-- Controls Info -->
                <div class="mt-8 text-slate-500 text-xs sm:text-sm">
                    <p class="mb-1">🎹 [A][D] Move | [S] Drop | [W]/[Space] Jump</p>
                    <p>📱 Mobile: Touch controls</p>
                </div>
                
                <!-- Version -->
                <p class="absolute bottom-4 text-slate-600 text-xs">v1.0</p>
            </div>
            
            <!-- Loading Screen Overlay -->
            <div id="loadingScreen" class="absolute inset-0 bg-slate-900 rounded-lg flex flex-col justify-center items-center text-center p-4 hidden z-30">
                <div class="mb-6">
                    <div class="text-5xl mb-4 animate-bounce">🦌</div>
                    <h2 class="text-xl sm:text-2xl font-bold text-white mb-2">Loading...</h2>
                </div>
                
                <!-- Progress Bar -->
                <div class="w-64 sm:w-80 h-3 bg-slate-700 rounded-full overflow-hidden">
                    <div id="loadingBar" class="h-full bg-gradient-to-r from-emerald-400 to-teal-500 rounded-full transition-all duration-100" style="width: 0%"></div>
                </div>
                <p id="loadingText" class="mt-3 text-slate-400 text-sm">Preparing adventure...</p>
            </div>
            
            <!-- Floating Pause Menu (Top Left) -->
            <div id="pauseMenu" class="absolute top-4 left-4 z-10 hidden">
                <!-- Menu Toggle Button -->
                <button id="pauseMenuBtn" class="bg-slate-800/90 hover:bg-slate-700 border border-slate-600 text-white font-bold w-10 h-10 rounded-lg shadow-lg flex items-center justify-center text-lg transition">
                    ☰
                </button>
                
                <!-- Dropdown Menu -->
                <div id="pauseDropdown" class="absolute top-12 left-0 bg-slate-800/95 border border-slate-600 rounded-lg shadow-xl overflow-hidden hidden backdrop-blur-sm min-w-[140px]">
                    <button id="pauseContinueBtn" class="w-full px-4 py-3 text-left text-white hover:bg-slate-700 flex items-center gap-2 text-sm font-medium transition">
                        ▶️ Continue
                    </button>
                    <div class="border-t border-slate-600"></div>
                    <button id="pauseExitBtn" class="w-full px-4 py-3 text-left text-red-400 hover:bg-slate-700 flex items-center gap-2 text-sm font-medium transition">
                        🚪 Exit
                    </button>
                </div>
            </div>
        </main>

        <!-- On-Screen Touch Controls (Mobile Only) -->
        <footer id="touchArea" class="touch-controls flex justify-between items-center px-6 py-3 bg-slate-800/50 shrink-0" style="touch-action: none;">
            <div class="flex gap-2 ml-2 pointer-events-none">
                <div id="btnLeft" class="touch-btn w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-xl font-bold">
                    ◀
                </div>
                <div id="btnDown" class="touch-btn w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-xl font-bold">
                    ▼
                </div>
                <div id="btnRight" class="touch-btn w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-xl font-bold">
                    ▶
                </div>
            </div>
            <div id="btnJump" class="jump-btn touch-btn w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-indigo-500/30 border-indigo-400/60 flex items-center justify-center text-xs sm:text-sm font-bold mr-2 pointer-events-none">
                JUMP
            </div>
        </footer>
    </div>

    <script>
        // Setup Game Canvas & Context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Internal resolution setup (retro aspect ratio)
        canvas.width = 640;
        canvas.height = 360;

        // Game Constants - Base values at 60 FPS
        const TARGET_FPS = 60;
        const GRAVITY_BASE = 0.45;
        const FRICTION = 0.82;
        
        // Delta time tracking
        let lastTime = 0;
        let deltaTime = 1;  // Multiplier (1 = normal speed at 60fps)

        // Sprite Loading - Individual frames dari folder terpisah
        const sprites = {
            idle: [],
            run: [],
            jump: new Image()
        };
        
        // Load idle sprites (9 frames)
        for (let i = 0; i <= 8; i++) {
            const img = new Image();
            img.src = `assets/sprites/idle/sprite_idle${i}.png`;
            sprites.idle.push(img);
        }
        
        // Load run sprites (6 frames)
        for (let i = 0; i <= 5; i++) {
            const img = new Image();
            img.src = `assets/sprites/run/sprite_${i}.png`;
            sprites.run.push(img);
        }
        
        // Load jump sprite
        sprites.jump.src = 'assets/sprites/jump/llama jump.png';
        
        // Sprite Configuration
        const SPRITE_CONFIG = {
            frameWidth: 48,
            frameHeight: 58,
            idleFrames: 9,
            runFrames: 6,
            idleSpeed: 0.02,   // Kecepatan animasi idle (sangat lambat)
            runSpeed: 0.10,    // Kecepatan animasi run (lebih lambat)
            idleDelay: 600     // 10 detik * 60 fps = 600 frames sebelum animasi idle aktif
        };

        // Particle System for Dust Effects
        const particles = [];
        
        class DustParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 3; // Random horizontal velocity
                this.vy = -Math.random() * 2 - 1;    // Upward velocity
                this.size = Math.random() * 4 + 2;   // Random size 2-6
                this.life = 1.0;                     // Full opacity
                this.decay = Math.random() * 0.03 + 0.02; // Fade speed
                this.color = Math.random() > 0.5 ? '#a8a29e' : '#78716c'; // Stone colors
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1; // Gravity on particles
                this.life -= this.decay;
                this.size *= 0.97; // Shrink over time
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x - cameraX, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            
            isDead() {
                return this.life <= 0 || this.size < 0.5;
            }
        }
        
        // Function to spawn dust particles
        function spawnDustParticles(x, y, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push(new DustParticle(x, y));
            }
        }
        
        // Update all particles
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].isDead()) {
                    particles.splice(i, 1);
                }
            }
        }
        
        // Draw all particles
        function drawParticles() {
            particles.forEach(p => p.draw());
        }

        // Game State Variables
        let gameState = 'MENU'; // MENU, LOADING, PLAYING, GAMEOVER, WIN
        let score = 0;
        let lives = 3;

        // Controls State
        const keys = {
            left: false,
            right: false,
            up: false,
            down: false  // New: for dropping through platforms
        };

        // Camera Offset
        let cameraX = 0;

        // Player Class
        class Player {
            constructor() {
                // Ukuran hitbox (lebih kecil dari sprite untuk gameplay yang fair)
                this.width = 30;
                this.height = 50;
                // Sprite animation properties
                this.currentFrame = 0;
                this.frameTimer = 0;
                this.idleFrame = 0;       // Separate frame counter for idle
                this.idleTimer = 0;       // Separate timer for idle animation
                this.inactiveTimer = 0;   // Timer untuk track berapa lama tidak ada action
                // Effect properties
                this.wasGrounded = false;  // Track landing for dust effect
                this.runBobTimer = 0;      // For run bobbing effect
                // Damage/death effect
                this.isHurt = false;
                this.hurtTimer = 0;
                this.blinkTimer = 0;
                this.visible = true;
                this.invincible = false;   // Brief invincibility after respawn
                this.invincibleTimer = 0;
                this.reset();
            }

            reset() {
                this.x = 50;
                this.y = 260; // Adjusted for taller sprite
                this.vx = 0;
                this.vy = 0;
                this.speed = 2.0;  // Kecepatan jalan lebih lambat
                this.jumpPower = -10.5;
                this.isGrounded = false;
                this.wasGrounded = false;
                this.facing = 'right';
                this.currentFrame = 0;
                this.frameTimer = 0;
                this.idleFrame = 0;
                this.idleTimer = 0;
                this.inactiveTimer = 0;
                this.runBobTimer = 0;
                this.isHurt = false;
                this.hurtTimer = 0;
                this.blinkTimer = 0;
                this.visible = true;
                this.invincible = false;
                this.invincibleTimer = 0;
            }

            update(platforms) {
                // Handle hurt/blink animation
                if (this.isHurt) {
                    this.hurtTimer--;
                    this.blinkTimer++;
                    
                    // Blink every 4 frames
                    this.visible = Math.floor(this.blinkTimer / 4) % 2 === 0;
                    
                    // After hurt animation, respawn
                    if (this.hurtTimer <= 0) {
                        this.isHurt = false;
                        this.visible = true;
                        this.blinkTimer = 0;
                        
                        // Respawn at checkpoint
                        this.x = currentCheckpoint.x;
                        this.y = currentCheckpoint.y;
                        this.vx = 0;
                        this.vy = 0;
                        this.isGrounded = false;
                        
                        // Brief invincibility after respawn
                        this.invincible = true;
                        this.invincibleTimer = 90; // 1.5 seconds
                    }
                    return; // Don't process movement while hurt
                }
                
                // Handle invincibility blinking after respawn
                if (this.invincible) {
                    this.invincibleTimer--;
                    this.blinkTimer++;
                    this.visible = Math.floor(this.blinkTimer / 6) % 2 === 0;
                    
                    if (this.invincibleTimer <= 0) {
                        this.invincible = false;
                        this.visible = true;
                        this.blinkTimer = 0;
                    }
                }
                
                // Track previous grounded state for landing detection
                this.wasGrounded = this.isGrounded;
                
                // Movement Horizontal - use fixed velocity, only apply delta on position
                if (keys.left) {
                    this.vx = -this.speed;
                    this.facing = 'left';
                } else if (keys.right) {
                    this.vx = this.speed;
                    this.facing = 'right';
                } else {
                    this.vx *= FRICTION;
                }

                // Jump Movement
                if (keys.up && this.isGrounded) {
                    this.vy = this.jumpPower;
                    this.isGrounded = false;
                    // Spawn small dust when jumping
                    spawnDustParticles(this.x + this.width / 2, this.y + this.height, 4);
                }

                // Apply Gravity (scaled by delta time)
                this.vy += GRAVITY_BASE * deltaTime;

                // Move Horizontal (scaled by delta time for consistent speed)
                this.x += this.vx * deltaTime;

                // Prevent player from walking backward out of the map bounds
                if (this.x < 0) {
                    this.x = 0;
                    this.vx = 0;
                }

                this.checkPlatformCollision(platforms, 'horizontal');

                // Move Vertical (scaled by delta time)
                this.y += this.vy * deltaTime;
                this.isGrounded = false;
                this.checkPlatformCollision(platforms, 'vertical');
                
                // Spawn dust particles on landing
                if (this.isGrounded && !this.wasGrounded) {
                    // Just landed! Spawn dust
                    spawnDustParticles(this.x + this.width / 2, this.y + this.height, 10);
                }

                // Respawn if fell into pit
                if (this.y > canvas.height + 100) {
                    playerHit();
                }
            }

            checkPlatformCollision(platforms, direction) {
                for (let p of platforms) {
                    // Check if this is a one-way platform (not solid)
                    const isOneWay = p.solid === false;
                    
                    // Basic collision check
                    const colliding = (
                        this.x < p.x + p.w &&
                        this.x + this.width > p.x &&
                        this.y < p.y + p.h &&
                        this.y + this.height > p.y
                    );
                    
                    if (!colliding) continue;
                    
                    if (direction === 'horizontal') {
                        // One-way platforms don't block horizontal movement
                        if (isOneWay) continue;
                        
                        if (this.vx > 0) this.x = p.x - this.width;
                        else if (this.vx < 0) this.x = p.x + p.w;
                    }
                    
                    if (direction === 'vertical') {
                        if (this.vy > 0) {
                            // Falling down
                            // For one-way platforms: only land if coming from above
                            const feetWereAbove = (this.y + this.height - this.vy * deltaTime) <= p.y + 4;
                            
                            // If pressing down on one-way platform, drop through
                            if (isOneWay && keys.down) {
                                continue; // Skip this platform, fall through
                            }
                            
                            // One-way: only collide if coming from above
                            if (isOneWay && !feetWereAbove) {
                                continue; // Pass through from below or side
                            }
                            
                            this.y = p.y - this.height;
                            this.vy = 0;
                            this.isGrounded = true;
                        } else if (this.vy < 0) {
                            // Moving up - one-way platforms don't block from below
                            if (isOneWay) continue;
                            
                            this.y = p.y + p.h;
                            this.vy = 0;
                        }
                    }
                }
            }

            draw() {
                // Don't draw if not visible (blinking)
                if (!this.visible) return;
                
                ctx.save();
                
                // Calculate effect offsets
                let yOffset = 0;
                const isMoving = Math.abs(this.vx) > 0.5;
                const hasAction = isMoving || !this.isGrounded || keys.left || keys.right || keys.up;
                
                // Track inactive time
                if (hasAction) {
                    this.inactiveTimer = 0;  // Reset timer jika ada action
                    this.idleFrame = 0;      // Reset idle animation
                    this.idleTimer = 0;
                } else {
                    this.inactiveTimer++;    // Increment inactive timer
                }
                
                if (this.isGrounded && isMoving) {
                    // Run bobbing effect - slight up/down bounce while running
                    this.runBobTimer += 0.3;
                    yOffset = Math.sin(this.runBobTimer) * 2;
                } else {
                    this.runBobTimer = 0;
                }
                
                // Posisi draw (sesuaikan agar sprite center dengan hitbox)
                const drawX = this.x - cameraX - 9; // offset untuk centering
                const drawY = this.y - 8 + yOffset; // offset karena sprite lebih tinggi + effect
                
                // Flip sprite jika menghadap kiri
                if (this.facing === 'left') {
                    ctx.translate(drawX + SPRITE_CONFIG.frameWidth, drawY);
                    ctx.scale(-1, 1);
                } else {
                    ctx.translate(drawX, drawY);
                }

                // Pilih sprite berdasarkan state
                let currentSprite;
                
                if (!this.isGrounded) {
                    // JUMPING/FALLING: Gunakan sprite jump
                    currentSprite = sprites.jump;
                } else if (isMoving) {
                    // RUNNING: Animasi 6 frame loop
                    this.frameTimer += SPRITE_CONFIG.runSpeed;
                    if (this.frameTimer >= 1) {
                        this.frameTimer = 0;
                        this.currentFrame++;
                        if (this.currentFrame >= SPRITE_CONFIG.runFrames) {
                            this.currentFrame = 0; // Loop back
                        }
                    }
                    currentSprite = sprites.run[this.currentFrame];
                } else if (this.inactiveTimer >= SPRITE_CONFIG.idleDelay) {
                    // FULL IDLE ANIMATION: Aktif setelah 10 detik tidak ada action
                    this.idleTimer += SPRITE_CONFIG.idleSpeed;
                    if (this.idleTimer >= 1) {
                        this.idleTimer = 0;
                        this.idleFrame++;
                        if (this.idleFrame >= SPRITE_CONFIG.idleFrames) {
                            this.idleFrame = 0; // Loop back
                        }
                    }
                    currentSprite = sprites.idle[this.idleFrame];
                } else {
                    // STANDING: Gunakan sprite_idle0 saja (belum 10 detik)
                    currentSprite = sprites.idle[0];
                    this.currentFrame = 0; // Reset run frame saat idle
                }

                // Draw sprite
                ctx.drawImage(
                    currentSprite,
                    0, 0,                                          // Source x, y
                    SPRITE_CONFIG.frameWidth, SPRITE_CONFIG.frameHeight,  // Source width, height
                    0, 0,                                          // Dest x, y
                    SPRITE_CONFIG.frameWidth, SPRITE_CONFIG.frameHeight   // Dest width, height
                );

                ctx.restore();
            }
        }

        // Enemy Class (Smart Chasing AI)
        class Enemy {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 20;
                this.height = 18;
                this.vx = 0;
                this.vy = 0;
                this.speed = 0.9; // Kecepatan dikurangi agar tidak terlalu cepat
                this.jumpPower = -8.5;
                this.alive = true;
                this.isGrounded = false;
                this.isChasing = false;
                this.detectionRadius = 220; // Distance to detect player
            }

            update(player, platforms) {
                if (!this.alive) return;

                // Calculate distance to player
                const dx = (player.x + player.width / 2) - (this.x + this.width / 2);
                const dy = (player.y + player.height / 2) - (this.y + this.height / 2);
                const dist = Math.hypot(dx, dy);

                // Detect if player is within agro/chase radius
                if (dist < this.detectionRadius) {
                    this.isChasing = true;

                    // Move horizontally towards player
                    if (dx > 5) {
                        this.vx = this.speed;
                    } else if (dx < -5) {
                        this.vx = -this.speed;
                    } else {
                        this.vx = 0;
                    }

                    // Jump ONLY when there is a wall blocking the enemy's path
                    const wallInFront = this.checkWallAhead(platforms);

                    if (wallInFront && this.isGrounded) {
                        this.vy = this.jumpPower;
                        this.isGrounded = false;
                    }
                } else {
                    this.isChasing = false;
                    this.vx *= FRICTION; // Slow down when player escapes detection
                }

                // Apply Gravity
                this.vy += GRAVITY_BASE;

                // Move Horizontal & Check Wall Collision
                this.x += this.vx;
                this.checkPlatformCollision(platforms, 'horizontal');

                // Move Vertical & Check Ground Collision
                this.y += this.vy;
                this.isGrounded = false;
                this.checkPlatformCollision(platforms, 'vertical');
            }

            checkWallAhead(platforms) {
                // Direction offset to probe wall ahead
                const offsetX = this.vx > 0 ? this.width + 4 : -4;
                const probeX = this.x + offsetX;
                const probeY = this.y + this.height - 4;

                for (let p of platforms) {
                    if (
                        probeX > p.x &&
                        probeX < p.x + p.w &&
                        probeY > p.y &&
                        probeY < p.y + p.h
                    ) {
                        return true;
                    }
                }
                return false;
            }

            checkPlatformCollision(platforms, direction) {
                for (let p of platforms) {
                    if (
                        this.x < p.x + p.w &&
                        this.x + this.width > p.x &&
                        this.y < p.y + p.h &&
                        this.y + this.height > p.y
                    ) {
                        if (direction === 'horizontal') {
                            if (this.vx > 0) this.x = p.x - this.width;
                            else if (this.vx < 0) this.x = p.x + p.w;
                        }
                        if (direction === 'vertical') {
                            if (this.vy > 0) {
                                this.y = p.y - this.height;
                                this.vy = 0;
                                this.isGrounded = true;
                            } else if (this.vy < 0) {
                                this.y = p.y + p.h;
                                this.vy = 0;
                            }
                        }
                    }
                }
            }

            draw() {
                if (!this.alive) return;
                ctx.save();
                ctx.translate(this.x - cameraX, this.y);

                // Mushroom Body
                ctx.fillStyle = this.isChasing ? '#dc2626' : '#ea580c'; // Red head when agro
                ctx.beginPath();
                ctx.arc(this.width / 2, 8, 10, Math.PI, 0, false);
                ctx.fill();

                // Mushroom Stalk
                ctx.fillStyle = '#ffe4e6';
                ctx.fillRect(4, 8, 12, 10);

                // Eyes
                ctx.fillStyle = this.isChasing ? '#ef4444' : '#000000';
                ctx.fillRect(6, 10, 2, 4);
                ctx.fillRect(12, 10, 2, 4);

                // Agro Indicator Bubble (!)
                if (this.isChasing) {
                    ctx.fillStyle = '#ef4444';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.fillText('!', this.width / 2 - 2, -4);
                }

                ctx.restore();
            }
        }

        // Checkpoint & Save System
        const SAVE_KEY = 'deer_adventure_save';
        let currentCheckpoint = { x: 50, y: 260 }; // Default spawn
        let showSavingMessage = false;
        let savingMessageTimer = 0;
        let savingMessageAlpha = 0;
        
        // Save game state to localStorage
        function saveGame() {
            const saveData = {
                checkpoint: currentCheckpoint,
                score: score,
                lives: lives,
                coinsCollected: level.coins.map(c => c.collected),
                checkpointsActivated: level.checkpoints.map(cp => cp.activated),
                enemiesAlive: level.enemies.map(e => e.alive)
            };
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
                console.log('Game saved!');
            } catch(e) {
                console.log('Could not save game:', e);
            }
        }
        
        // Load game state from localStorage
        function loadGame() {
            try {
                const saveData = JSON.parse(localStorage.getItem(SAVE_KEY));
                if (saveData) {
                    currentCheckpoint = saveData.checkpoint || { x: 50, y: 260 };
                    score = saveData.score || 0;
                    lives = saveData.lives || 3;
                    
                    // Restore coins
                    if (saveData.coinsCollected) {
                        saveData.coinsCollected.forEach((collected, i) => {
                            if (level.coins[i]) level.coins[i].collected = collected;
                        });
                    }
                    
                    // Restore checkpoints
                    if (saveData.checkpointsActivated) {
                        saveData.checkpointsActivated.forEach((activated, i) => {
                            if (level.checkpoints[i]) level.checkpoints[i].activated = activated;
                        });
                    }
                    
                    // Restore enemies
                    if (saveData.enemiesAlive) {
                        saveData.enemiesAlive.forEach((alive, i) => {
                            if (level.enemies[i]) level.enemies[i].alive = alive;
                        });
                    }
                    
                    // Move player to checkpoint
                    player.x = currentCheckpoint.x;
                    player.y = currentCheckpoint.y;
                    
                    updateHUD();
                    console.log('Game loaded from save!');
                    return true;
                }
            } catch(e) {
                console.log('Could not load game:', e);
            }
            return false;
        }
        
        // Clear save data
        function clearSave() {
            try {
                localStorage.removeItem(SAVE_KEY);
                console.log('Save data cleared!');
            } catch(e) {
                console.log('Could not clear save:', e);
            }
        }
        
        // Check if player entered checkpoint area
        function checkCheckpoints() {
            level.checkpoints.forEach((cp, index) => {
                if (!cp.activated) {
                    // Check if player is within checkpoint area (X range only)
                    if (player.x >= cp.xStart && player.x <= cp.xEnd) {
                        cp.activated = true;
                        currentCheckpoint = { x: player.x, y: player.y };
                        
                        // Autosave
                        saveGame();
                        
                        // Show saving message
                        showSavingMessage = true;
                        savingMessageTimer = 90; // 1.5 seconds
                        savingMessageAlpha = 1;
                    }
                }
            });
        }
        
        // Draw saving message at top right
        function drawSavingMessage() {
            if (showSavingMessage && savingMessageTimer > 0) {
                savingMessageTimer--;
                
                // Fade out in last 30 frames
                if (savingMessageTimer < 30) {
                    savingMessageAlpha = savingMessageTimer / 30;
                }
                
                ctx.save();
                ctx.globalAlpha = savingMessageAlpha;
                ctx.fillStyle = '#22c55e';
                ctx.font = 'bold 12px Courier';
                ctx.textAlign = 'right';
                ctx.fillText('Saving...', canvas.width - 15, 25);
                ctx.restore();
                
                if (savingMessageTimer <= 0) {
                    showSavingMessage = false;
                }
            }
        }

        // Initialize Entities
        const player = new Player();

        // Check Collisions for Collectibles & Enemies
        function checkCollisions() {
            // Skip collision checks if player is hurt or invincible
            const canTakeDamage = !player.isHurt && !player.invincible;
            
            // Coins (can still collect while invincible)
            level.coins.forEach(coin => {
                if (!coin.collected) {
                    if (
                        player.x < coin.x + 12 &&
                        player.x + player.width > coin.x &&
                        player.y < coin.y + 12 &&
                        player.y + player.height > coin.y
                    ) {
                        coin.collected = true;
                        score += 100;
                        updateHUD();
                        
                        // Auto-save when coin is collected
                        saveGame();
                    }
                }
            });

            // Spikes - only if can take damage
            if (canTakeDamage) {
                level.spikes.forEach(spike => {
                    if (
                        player.x < spike.x + spike.w &&
                        player.x + player.width > spike.x &&
                        player.y < spike.y + spike.h &&
                        player.y + player.height > spike.y
                    ) {
                        playerHit();
                    }
                });
            }

            // Enemies
            level.enemies.forEach(enemy => {
                if (!enemy.alive) return;

                if (
                    player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y
                ) {
                    // Stomp Enemy from above (can stomp even while invincible)
                    if (player.vy > 0 && player.y + player.height - player.vy <= enemy.y + 8) {
                        enemy.alive = false;
                        player.vy = player.jumpPower * 0.7; // Bounce
                        score += 200;
                        updateHUD();
                        
                        // Auto-save when enemy is killed
                        saveGame();
                    } else if (canTakeDamage) {
                        // Only take damage if not invincible
                        playerHit();
                    }
                }
            });

            // Victory Flag
            const flag = level.flag;
            if (
                player.x < flag.x + flag.w &&
                player.x + player.width > flag.x &&
                player.y < flag.y + flag.h &&
                player.y + player.height > flag.y
            ) {
                gameWin();
            }
        }

        function playerHit() {
            // Ignore if already hurt or invincible
            if (player.isHurt || player.invincible) return;
            
            lives--;
            updateHUD();
            
            if (lives <= 0) {
                gameOver("Kamu kehabisan nyawa!");
            } else {
                // Start hurt/blink animation
                player.isHurt = true;
                player.hurtTimer = 60; // 1 second of blinking
                player.blinkTimer = 0;
                player.vx = 0;
                player.vy = -5; // Small bounce up
            }
        }

        function updateHUD() {
            document.getElementById('scoreText').innerText = String(score).padStart(3, '0');
            document.getElementById('livesText').innerText = '❤'.repeat(Math.max(0, lives));
        }

        function gameOver(msg) {
            gameState = 'GAMEOVER';
            document.getElementById('overlayTitle').innerText = 'GAME OVER';
            document.getElementById('overlayTitle').className = 'text-2xl sm:text-4xl md:text-5xl font-extrabold mb-2 text-red-500 drop-shadow-md';
            document.getElementById('overlayMessage').innerText = msg;
            document.getElementById('overlay').classList.remove('hidden');
        }

        function gameWin() {
            gameState = 'WIN';
            document.getElementById('overlayTitle').innerText = 'VICTORY!';
            document.getElementById('overlayTitle').className = 'text-2xl sm:text-4xl md:text-5xl font-extrabold mb-2 text-yellow-400 drop-shadow-md';
            document.getElementById('overlayMessage').innerText = `Selamat! Skor: ${score}`;
            document.getElementById('overlay').classList.remove('hidden');
        }

        function resetGame() {
            // Clear save when restarting
            clearSave();
            
            score = 0;
            lives = 3;
            currentCheckpoint = { x: 50, y: 260 };
            
            player.x = 50;
            player.y = 260;
            player.vx = 0;
            player.vy = 0;
            player.isGrounded = false;
            player.facing = 'right';
            player.currentFrame = 0;
            player.frameTimer = 0;
            player.idleFrame = 0;
            player.idleTimer = 0;
            player.inactiveTimer = 0;
            player.isHurt = false;
            player.hurtTimer = 0;
            player.blinkTimer = 0;
            player.visible = true;
            player.invincible = false;
            player.invincibleTimer = 0;
            
            level.coins.forEach(c => c.collected = false);
            level.checkpoints.forEach(cp => cp.activated = false);
            level.enemies.forEach((e, i) => {
                e.alive = true;
                // Reset enemy positions
                const positions = [[300, 290], [620, 290], [1050, 290], [1400, 290]];
                if (positions[i]) {
                    e.x = positions[i][0];
                    e.y = positions[i][1];
                }
            });
            
            cameraX = 0;
            gameState = 'PLAYING';
            
            updateHUD();
            document.getElementById('overlay').classList.add('hidden');
        }
        
        // Return to main menu
        function returnToMenu() {
            gameState = 'MENU';
            
            // Check if save exists for Continue button
            const hasSave = localStorage.getItem(SAVE_KEY) !== null;
            const continueBtn = document.getElementById('continueBtn');
            
            if (hasSave) {

                continueBtn.style.opacity = '1';

            document.getElementById('mainMenu').classList.remove('hidden');
        }

        // Draw Parallax Sky & Level Elements
        function render() {
            // === LAYER 0: Sky Gradient ===
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#1a1a2e');    // Gelap atas (malam/senja)
            skyGradient.addColorStop(0.3, '#16213e'); // Biru gelap
            skyGradient.addColorStop(0.6, '#1f4068'); // Biru medium
            skyGradient.addColorStop(1, '#4a6fa5');   // Biru terang bawah
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // === LAYER 1: Distant Mountains (paling jauh) ===
            ctx.fillStyle = '#2d3a4f';
            drawMountainLayer(0.05, 180, 120, 200);
            
            // === LAYER 2: Mid Mountains ===
            ctx.fillStyle = '#1e3a2f';
            drawMountainLayer(0.1, 220, 80, 150);
            
            // === LAYER 3: Near Mountains with snow caps ===
            ctx.fillStyle = '#152e1f';
            drawMountainLayer(0.15, 250, 60, 120);
            // Snow caps
            ctx.fillStyle = '#e8e8e8';
            drawSnowCaps(0.15, 250, 60, 120);
            
            // === LAYER 4: Distant Pine Trees ===
            ctx.fillStyle = '#0d2818';
            drawPineTreeLayer(0.2, 280, 40, 60, 80);
            
            // === LAYER 5: Mid Pine Trees ===
            ctx.fillStyle = '#0a3d1e';
            drawPineTreeLayer(0.3, 300, 50, 70, 50);
            
            // === LAYER 6: Near Pine Trees ===
            ctx.fillStyle = '#0f5223';
            drawPineTreeLayer(0.4, 310, 60, 80, 35);
            
            // === LAYER 7: Fog/Mist Effect ===
            ctx.fillStyle = 'rgba(200, 220, 210, 0.1)';
            ctx.fillRect(0, 260, canvas.width, 40);
            
            // === LAYER 8: Ground bushes (foreground parallax) ===
            drawBushLayer(0.5, 330);

            // Platforms (dengan tekstur tanah hutan)
            level.platforms.forEach(p => {
                // Platform body - tanah coklat
                ctx.fillStyle = '#3d2914';
                ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
                
                // Layer tanah gelap
                ctx.fillStyle = '#2a1d0d';
                ctx.fillRect(p.x - cameraX, p.y + p.h - 8, p.w, 8);
                
                // Top grass/moss - hijau hutan
                ctx.fillStyle = '#1a5c2e';
                ctx.fillRect(p.x - cameraX, p.y, p.w, 6);
                
                // Grass detail pixels
                ctx.fillStyle = '#2d8a47';
                for (let gx = p.x; gx < p.x + p.w; gx += 8) {
                    if (Math.sin(gx * 0.5) > 0.3) {
                        ctx.fillRect(gx - cameraX, p.y - 2, 4, 4);
                    }
                    if (Math.cos(gx * 0.7) > 0.5) {
                        ctx.fillRect(gx - cameraX + 2, p.y - 4, 2, 6);
                    }
                }
            });

            // Coins (golden acorn style)
            level.coins.forEach(c => {
                if (!c.collected) {
                    // Outer glow
                    ctx.fillStyle = 'rgba(250, 204, 21, 0.3)';
                    ctx.beginPath();
                    ctx.arc(c.x + 6 - cameraX, c.y + 6, 10, 0, Math.PI * 2);
                    ctx.fill();
                    // Main coin
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.arc(c.x + 6 - cameraX, c.y + 6, 6, 0, Math.PI * 2);
                    ctx.fill();
                    // Shine
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath();
                    ctx.arc(c.x + 4 - cameraX, c.y + 4, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Spikes (wooden/thorny style)
            level.spikes.forEach(s => {
                ctx.fillStyle = '#5c4033';
                ctx.beginPath();
                ctx.moveTo(s.x - cameraX, s.y + s.h);
                ctx.lineTo(s.x + s.w / 2 - cameraX, s.y);
                ctx.lineTo(s.x + s.w - cameraX, s.y + s.h);
                ctx.closePath();
                ctx.fill();
                // Thorn tip
                ctx.fillStyle = '#8b5a2b';
                ctx.beginPath();
                ctx.moveTo(s.x + s.w/2 - 3 - cameraX, s.y + 8);
                ctx.lineTo(s.x + s.w / 2 - cameraX, s.y);
                ctx.lineTo(s.x + s.w/2 + 3 - cameraX, s.y + 8);
                ctx.closePath();
                ctx.fill();
            });

            // Flag (wooden pole with green flag)
            const f = level.flag;
            ctx.fillStyle = '#5c4033';
            ctx.fillRect(f.x - cameraX, f.y, 4, f.h); // wooden pole
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.moveTo(f.x + 4 - cameraX, f.y);
            ctx.lineTo(f.x + 28 - cameraX, f.y + 14);
            ctx.lineTo(f.x + 4 - cameraX, f.y + 28);
            ctx.closePath();
            ctx.fill();
            // Flag detail
            ctx.fillStyle = '#16a34a';
            ctx.beginPath();
            ctx.moveTo(f.x + 4 - cameraX, f.y + 8);
            ctx.lineTo(f.x + 18 - cameraX, f.y + 14);
            ctx.lineTo(f.x + 4 - cameraX, f.y + 20);
            ctx.closePath();

            // Dust Particles (draw behind player for better effect)

            // Saving message (top right corner)

            // === FOREGROUND: Floating particles/fireflies ===
            drawFireflies();
        }
        
        // Helper: Draw mountain silhouette layer
        function drawMountainLayer(parallaxSpeed, baseY, minHeight, maxHeight) {
            const offsetX = cameraX * parallaxSpeed;
            ctx.beginPath();
            ctx.moveTo(-50, canvas.height);
            
            let x = -50;
            while (x < canvas.width + 100) {
                const height = minHeight + Math.abs(Math.sin(x * 0.008 + offsetX * 0.001)) * (maxHeight - minHeight);
                const peakX = x + 40 + Math.sin(x * 0.02) * 20;
                ctx.lineTo(x - offsetX % 200, baseY);
                ctx.lineTo(peakX - offsetX % 200, baseY - height);
                x += 80 + Math.sin(x) * 30;
            }
            
            ctx.lineTo(canvas.width + 50, canvas.height);
            ctx.closePath();
            ctx.fill();
        }
        
        // Helper: Draw snow caps on mountains
        function drawSnowCaps(parallaxSpeed, baseY, minHeight, maxHeight) {
            const offsetX = cameraX * parallaxSpeed;
            
            let x = -50;
            while (x < canvas.width + 100) {
                const height = minHeight + Math.abs(Math.sin(x * 0.008 + offsetX * 0.001)) * (maxHeight - minHeight);
                const peakX = x + 40 + Math.sin(x * 0.02) * 20;
                const snowY = baseY - height;
                
                // Snow cap triangle
                ctx.beginPath();
                ctx.moveTo(peakX - offsetX % 200 - 15, snowY + 20);
                ctx.lineTo(peakX - offsetX % 200, snowY);
                ctx.lineTo(peakX - offsetX % 200 + 15, snowY + 20);
                ctx.closePath();
                ctx.fill();
                
                x += 80 + Math.sin(x) * 30;
            }
        }
        
        // Helper: Draw pine tree silhouette layer
        function drawPineTreeLayer(parallaxSpeed, baseY, minH, maxH, spacing) {
            const offsetX = cameraX * parallaxSpeed;
            
            for (let x = -spacing; x < canvas.width + spacing * 2; x += spacing) {
                const treeX = x - (offsetX % spacing);
                const height = minH + Math.abs(Math.sin(x * 0.1)) * (maxH - minH);
                const width = height * 0.5;
                
                // Tree trunk
                ctx.fillRect(treeX - 2, baseY - 10, 4, 10);
                
                // Pine tree shape (triangle layers)
                ctx.beginPath();
                ctx.moveTo(treeX, baseY - height);
                ctx.lineTo(treeX - width/2, baseY - 10);
                ctx.lineTo(treeX + width/2, baseY - 10);
                ctx.closePath();
                ctx.fill();
            }
        }
        
        // Helper: Draw bush layer
        function drawBushLayer(parallaxSpeed, baseY) {
            const offsetX = cameraX * parallaxSpeed;
            ctx.fillStyle = '#1a472a';
            
            for (let x = -30; x < canvas.width + 60; x += 45) {
                const bushX = x - (offsetX % 45);
                const size = 12 + Math.sin(x * 0.2) * 5;
                
                ctx.beginPath();
                ctx.arc(bushX, baseY, size, Math.PI, 0);
                ctx.arc(bushX + size, baseY, size * 0.8, Math.PI, 0);
                ctx.arc(bushX - size * 0.5, baseY, size * 0.6, Math.PI, 0);
                ctx.fill();
            }
        }
        
        // Helper: Draw floating fireflies
        let fireflyTime = 0;
        function drawFireflies() {
            fireflyTime += 0.02;
            ctx.fillStyle = 'rgba(255, 255, 150, 0.6)';
            
            for (let i = 0; i < 8; i++) {
                const x = (i * 97 + Math.sin(fireflyTime + i) * 30) % canvas.width;
                const y = 200 + Math.cos(fireflyTime * 0.5 + i * 2) * 50;
                const size = 2 + Math.sin(fireflyTime * 2 + i) * 1;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Main Game Loop with delta time for consistent speed
        function loop(currentTime = performance.now()) {
            // Calculate delta time (normalize to 60 FPS)
            if (lastTime === 0) lastTime = currentTime;
            const elapsed = currentTime - lastTime;
            lastTime = currentTime;
            
            // Delta = 1.0 at 60fps, 2.0 at 30fps, 0.5 at 120fps
            // Prevent NaN or Infinity
            deltaTime = elapsed > 0 ? Math.min(elapsed / (1000 / TARGET_FPS), 3) : 1;
            
            // Only render background for menu/loading states
            if (gameState === 'MENU' || gameState === 'LOADING') {
                // Render static background for menu
                renderMenuBackground();
                requestAnimationFrame(loop);
                return;
            }
            
            if (gameState === 'PLAYING') {
                player.update(level.platforms);

                // Update Camera (Center on player smoothly)
                cameraX = player.x - canvas.width / 3;
                cameraX = Math.max(0, Math.min(cameraX, level.width - canvas.width));

                // Update Enemies
                level.enemies.forEach(e => e.update(player, level.platforms));
                
                // Update Particles
                updateParticles();
                
                // Check checkpoint collisions
                checkCheckpoints();

                checkCollisions();
            }

            render();
            requestAnimationFrame(loop);
        }
        
        // Render background for menu screen
        function renderMenuBackground() {
            // === LAYER 0: Sky Gradient ===
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#1a1a2e');
            skyGradient.addColorStop(0.3, '#16213e');
            skyGradient.addColorStop(0.6, '#1f4068');
            skyGradient.addColorStop(1, '#4a6fa5');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Animated mountains with slow parallax
            const menuCameraX = (performance.now() * 0.01) % 500;
            
            // Mountains
            ctx.fillStyle = '#2d3a4f';
            drawMenuMountain(menuCameraX * 0.05, 180, 120, 200);
            ctx.fillStyle = '#1e3a2f';
            drawMenuMountain(menuCameraX * 0.1, 220, 80, 150);
            ctx.fillStyle = '#152e1f';
            drawMenuMountain(menuCameraX * 0.15, 250, 60, 120);
            
            // Trees
            ctx.fillStyle = '#0d2818';
            drawMenuTrees(menuCameraX * 0.2, 280, 40, 60, 80);
            ctx.fillStyle = '#0a3d1e';
            drawMenuTrees(menuCameraX * 0.3, 300, 50, 70, 50);
            
            // Ground
            ctx.fillStyle = '#1a472a';
            ctx.fillRect(0, 320, canvas.width, 40);
            
            // Fireflies
            drawFireflies();
        }
        
        function drawMenuMountain(offsetX, baseY, minH, maxH) {
            ctx.beginPath();
            ctx.moveTo(-50, canvas.height);
            let x = -50;
            while (x < canvas.width + 100) {
                const height = minH + Math.abs(Math.sin(x * 0.008 + offsetX * 0.001)) * (maxH - minH);
                const peakX = x + 40 + Math.sin(x * 0.02) * 20;
                ctx.lineTo(x - offsetX % 200, baseY);
                ctx.lineTo(peakX - offsetX % 200, baseY - height);
                x += 80 + Math.sin(x) * 30;
            }
            ctx.lineTo(canvas.width + 50, canvas.height);
            ctx.closePath();
            ctx.fill();
        }
        
        function drawMenuTrees(offsetX, baseY, minH, maxH, spacing) {
            for (let x = -spacing; x < canvas.width + spacing * 2; x += spacing) {
                const treeX = x - (offsetX % spacing);
                const height = minH + Math.abs(Math.sin(x * 0.1)) * (maxH - minH);
                const width = height * 0.5;
                ctx.fillRect(treeX - 2, baseY - 10, 4, 10);
                ctx.beginPath();
                ctx.moveTo(treeX, baseY - height);
                ctx.lineTo(treeX - width/2, baseY - 10);
                ctx.lineTo(treeX + width/2, baseY - 10);
                ctx.closePath();
                ctx.fill();
            }
        }

        // Input Event Handlers
        window.addEventListener('keydown', e => {
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
            if (e.key === 'w' || e.key === 'W' || e.key === ' ' || e.key === 'ArrowUp') keys.up = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.down = true;
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
            if (e.key === 'w' || e.key === 'W' || e.key === ' ' || e.key === 'ArrowUp') keys.up = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.down = false;
        });

        // Direct touch tracking on footer area - bypasses all browser delays
        const touchArea = document.getElementById('touchArea');
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnDown = document.getElementById('btnDown');
        const btnJump = document.getElementById('btnJump');
        
        const activeTouches = new Map(); // Track multiple touches
        
        function updateButtonStates() {
            // Reset all
            keys.left = false;
            keys.right = false;
            keys.down = false;
            keys.up = false;
            btnLeft.classList.remove('pressed');
            btnRight.classList.remove('pressed');
            btnDown.classList.remove('pressed');
            btnJump.classList.remove('pressed');
            
            // Check each active touch
            activeTouches.forEach((touchData) => {
                if (touchData.button === 'left') {
                    keys.left = true;
                    btnLeft.classList.add('pressed');
                } else if (touchData.button === 'right') {
                    keys.right = true;
                    btnRight.classList.add('pressed');
                } else if (touchData.button === 'down') {
                    keys.down = true;
                    btnDown.classList.add('pressed');
                } else if (touchData.button === 'jump') {
                    keys.up = true;
                    btnJump.classList.add('pressed');
                }
            });
        }
        
        function getTouchedButton(x, y) {
            const leftRect = btnLeft.getBoundingClientRect();
            const rightRect = btnRight.getBoundingClientRect();
            const downRect = btnDown.getBoundingClientRect();
            const jumpRect = btnJump.getBoundingClientRect();
            
            // Expand hit areas by 10px for easier touch
            const expand = 10;
            
            if (x >= leftRect.left - expand && x <= leftRect.right + expand &&
                y >= leftRect.top - expand && y <= leftRect.bottom + expand) {
                return 'left';
            }
            if (x >= downRect.left - expand && x <= downRect.right + expand &&
                y >= downRect.top - expand && y <= downRect.bottom + expand) {
                return 'down';
            }
            if (x >= rightRect.left - expand && x <= rightRect.right + expand &&
                y >= rightRect.top - expand && y <= rightRect.bottom + expand) {
                return 'right';
            }
            if (x >= jumpRect.left - expand && x <= jumpRect.right + expand &&
                y >= jumpRect.top - expand && y <= jumpRect.bottom + expand) {
                return 'jump';
            }
            return null;
        }
        
        // Handle touch start
        touchArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const button = getTouchedButton(touch.clientX, touch.clientY);
                if (button) {
                    activeTouches.set(touch.identifier, { button });
                }
            }
            updateButtonStates();
        }, { passive: false });
        
        // Handle touch move (in case finger slides)
        touchArea.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const button = getTouchedButton(touch.clientX, touch.clientY);
                if (activeTouches.has(touch.identifier)) {
                    activeTouches.set(touch.identifier, { button });
                }
            }
            updateButtonStates();
        }, { passive: false });
        
        // Handle touch end
        touchArea.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                activeTouches.delete(touch.identifier);
            }
            updateButtonStates();
        }, { passive: false });
        
        // Handle touch cancel
        touchArea.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                activeTouches.delete(touch.identifier);
            }
            updateButtonStates();
        }, { passive: false });

        document.getElementById('resetBtn').addEventListener('click', resetGame);
        document.getElementById('restartOverlayBtn').addEventListener('click', resetGame);
        
        // Fullscreen toggle - with Android landscape support
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', async () => {
                const container = document.querySelector('.game-container');
                
                if (!document.fullscreenElement) {
                    try {
                        // Try standard fullscreen first
                        if (container.requestFullscreen) {
                            await container.requestFullscreen();
                        } else if (container.webkitRequestFullscreen) {
                            await container.webkitRequestFullscreen();
                        } else if (container.msRequestFullscreen) {
                            await container.msRequestFullscreen();
                        }
                        
                        // Lock to landscape if supported
                        if (screen.orientation && screen.orientation.lock) {
                            try {
                                await screen.orientation.lock('landscape');
                            } catch(e) {
                                // Orientation lock not supported
                            }
                        }
                    } catch(err) {
                        console.log('Fullscreen not available:', err);
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }
            });
        }
        
        // Handle fullscreen change - resize canvas
        document.addEventListener('fullscreenchange', resizeCanvas);
        document.addEventListener('webkitfullscreenchange', resizeCanvas);
        
        function resizeCanvas() {
            // Force redraw after fullscreen change
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 100);
        }
        
        // Block document level touch to prevent browser gestures
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        // Prevent context menu
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // Start Loop on window load
        window.onload = () => {
            // Check if save exists for Continue button
            const hasSave = localStorage.getItem(SAVE_KEY) !== null;
            const continueBtn = document.getElementById('continueBtn');
            
            if (hasSave) {
                continueBtn.disabled = false;
                continueBtn.style.opacity = '1';
            } else {
                continueBtn.disabled = true;
                continueBtn.style.opacity = '0.5';
            }
            
            // Hide header and touch controls in menu
            document.querySelector('.game-header').style.display = 'none';
            document.querySelector('.touch-controls').style.display = 'none';
            
            updateHUD();
            requestAnimationFrame(loop);
        };
        
        // Menu button handlers
        document.getElementById('newGameBtn').addEventListener('click', () => {
            // Clear any existing save
            clearSave();
            // Reset game state
            score = 0;
            lives = 3;
            currentCheckpoint = { x: 50, y: 260 };
            player.reset();
            level.coins.forEach(c => c.collected = false);
            level.checkpoints.forEach(cp => cp.activated = false);
            level.enemies.forEach((e, i) => {
                e.alive = true;
                const positions = [[300, 290], [620, 290], [1050, 290], [1400, 290]];
                if (positions[i]) {
                    e.x = positions[i][0];
                    e.y = positions[i][1];
                }
            });
            updateHUD();
            
            // Show loading screen
            showLoadingScreen(false);
        });
        
        document.getElementById('continueBtn').addEventListener('click', () => {
            // Load saved game
            const hasSave = loadGame();
            if (!hasSave) {
                // No save found, treat as new game
                score = 0;
                lives = 3;
                player.reset();
            }
            updateHUD();
            
            // Show loading screen
            showLoadingScreen(true);
        });
        
        // Loading screen animation
        function showLoadingScreen(isContinue) {
            // Hide menu, show loading
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('loadingScreen').classList.remove('hidden');
            
            const loadingBar = document.getElementById('loadingBar');
            const loadingText = document.getElementById('loadingText');
            
            const messages = [
                'Preparing adventure...',
                'Loading sprites...',
                'Building forest...',
                'Spawning enemies...',
                'Almost ready...',
                isContinue ? 'Restoring progress...' : 'Starting new journey...'
            ];
            
            let progress = 0;
            let messageIndex = 0;
            
            const loadingInterval = setInterval(() => {
                progress += Math.random() * 15 + 5; // Random increment 5-20%
                
                if (progress >= 100) {
                    progress = 100;
                    loadingBar.style.width = '100%';
                    loadingText.textContent = 'Ready!';
                    
                    clearInterval(loadingInterval);
                    
                    // Start game after short delay
                    setTimeout(() => {
                        startGame();
                    }, 300);
                } else {
                    loadingBar.style.width = progress + '%';
                    
                    // Update message based on progress
                    const newIndex = Math.floor(progress / 20);
                    if (newIndex !== messageIndex && newIndex < messages.length) {
                        messageIndex = newIndex;
                        loadingText.textContent = messages[messageIndex];
                    }
                }
            }, 100);
        }
        
        // Start the actual game
        function startGame() {
            // Hide loading, show game UI
            document.getElementById('loadingScreen').classList.add('hidden');
            document.querySelector('.game-header').style.display = 'flex';
            
            // Show pause menu button
            document.getElementById('pauseMenu').classList.remove('hidden');
            document.getElementById('pauseDropdown').classList.add('hidden');
            
            // Show touch controls only on mobile
            const isMobile = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
            if (isMobile) {
                document.querySelector('.touch-controls').style.display = 'flex';
            }
            
            // Set game state to playing
            gameState = 'PLAYING';
        }
        
        // Pause Menu Logic
        const pauseMenuBtn = document.getElementById('pauseMenuBtn');
        const pauseDropdown = document.getElementById('pauseDropdown');
        const pauseContinueBtn = document.getElementById('pauseContinueBtn');
        const pauseExitBtn = document.getElementById('pauseExitBtn');
        let isPaused = false;
        
        // Toggle pause menu
        pauseMenuBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseDropdown.classList.toggle('hidden');
            
            if (isPaused) {
                pauseMenuBtn.textContent = '✕';
                pauseMenuBtn.classList.add('bg-red-600/90', 'hover:bg-red-500');
                pauseMenuBtn.classList.remove('bg-slate-800/90', 'hover:bg-slate-700');
            } else {
                pauseMenuBtn.textContent = '☰';
                pauseMenuBtn.classList.remove('bg-red-600/90', 'hover:bg-red-500');
                pauseMenuBtn.classList.add('bg-slate-800/90', 'hover:bg-slate-700');
            }
        });
        
        // Continue button - close menu and resume
        pauseContinueBtn.addEventListener('click', () => {
            isPaused = false;
            pauseDropdown.classList.add('hidden');
            pauseMenuBtn.textContent = '☰';
            pauseMenuBtn.classList.remove('bg-red-600/90', 'hover:bg-red-500');
            pauseMenuBtn.classList.add('bg-slate-800/90', 'hover:bg-slate-700');
        });
        
        // Exit button - return to main menu
        pauseExitBtn.addEventListener('click', () => {
            isPaused = false;
            pauseDropdown.classList.add('hidden');
            pauseMenuBtn.textContent = '☰';
            pauseMenuBtn.classList.remove('bg-red-600/90', 'hover:bg-red-500');
            pauseMenuBtn.classList.add('bg-slate-800/90', 'hover:bg-slate-700');
            
            // Hide pause menu and return to main menu
            document.getElementById('pauseMenu').classList.add('hidden');
            returnToMenu();
        });
        
        // Close pause menu when clicking outside
        document.addEventListener('click', (e) => {
            if (isPaused && !document.getElementById('pauseMenu').contains(e.target)) {
                isPaused = false;
                pauseDropdown.classList.add('hidden');
                pauseMenuBtn.textContent = '☰';
                pauseMenuBtn.classList.remove('bg-red-600/90', 'hover:bg-red-500');
                pauseMenuBtn.classList.add('bg-slate-800/90', 'hover:bg-slate-700');
            }
        });
        
        // ESC key to toggle pause
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && gameState === 'PLAYING') {
                pauseMenuBtn.click();
            }
        });
    </script>
</body>
</html>
